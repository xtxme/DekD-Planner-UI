
[functions.canvas-proxy]
enabled = true
verify_jwt = false
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/canvas-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/canvas-proxy/*.html" ]

[functions.canvas-assignments-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/canvas-assignments-proxy/deno.json"
entrypoint = "./functions/canvas-assignments-proxy/index.ts"

[functions.canvas-assignment-details-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/canvas-assignment-details-proxy/deno.json"
entrypoint = "./functions/canvas-assignment-details-proxy/index.ts"
